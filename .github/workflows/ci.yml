name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version, changelog, Python 3.9 syntax, no private data tracked
        run: python3 scripts/release_check.py

  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }     # the oldest version the README supports
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }   # PLAY_WINDOWS.bat is a supported way to play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The game uses only the standard library, so there is nothing to install or cache.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
