name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version, changelog, Python 3.9 syntax, no private data tracked
        run: python3 scripts/release_check.py

  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is the oldest version the README supports. ubuntu-latest (26.04) no longer has it,
          # so both Linux jobs use 24.04, which does.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The game uses only the standard library, so there is nothing to install or cache.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  tests-windows:
    name: Tests (Python 3.13, windows-latest) - report only
    runs-on: windows-latest
    timeout-minutes: 40
    # PLAY_WINDOWS.bat is a supported way to play, so this runs on every change. It does not block merges or
    # releases yet: on its first run all 468 tests passed but 18 errored while deleting temporary folders whose
    # SQLite files were still locked (Windows will not delete an open file). Fix the tests' cleanup, then remove
    # this line so the job blocks like the others.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
