name: Release

# Push a tag "v" + VERSION (for example v0.62) to build a draft GitHub Release. See docs/RELEASING.md.
# "Run workflow" (manual) rehearses the same checks and builds the files as a workflow artifact, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; merge first, then tag the merge commit"; exit 1; }
      - name: Tag matches VERSION and the changelog has its notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then python scripts/release_check.py --tag "$GITHUB_REF_NAME"
          else python scripts/release_check.py; fi
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  package:
    name: Build release files
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Source archives from git (reproducible) and checksums
        run: |
          VERSION=$(python -c "import re;print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"',open('hs/ui/settings.py').read(),re.M).group(1))")
          mkdir dist
          git archive --format=zip    --prefix="hockey-manager-$VERSION/" -o "dist/hockey-manager-$VERSION.zip"    HEAD
          git archive --format=tar.gz --prefix="hockey-manager-$VERSION/" -o "dist/hockey-manager-$VERSION.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if [ "$GITHUB_REF_TYPE" = tag ]; then python scripts/release_check.py --notes "$VERSION" > dist/NOTES.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Hockey Manager ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md
